<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🇯🇵⇄🇵🇭 翻訳</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --ja:#1a1a2e; --fil:#b03030; --accent:#e74c3c;
  --bg:#f2ede9; --card:#fff; --border:#ddd8d0;
  --muted:#999; --text:#1a1a2e;
  --green:#219150; --orange:#d4690a;
  --r:18px; --sh:0 3px 20px rgba(0,0,0,.09);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;align-items:center;min-height:100vh;padding-bottom:48px;}

/* HEADER */
header{width:100%;max-width:500px;padding:20px 16px 8px;
  display:flex;align-items:center;justify-content:center;gap:8px;}
.flag{font-size:26px;}
.htitle{font-size:17px;font-weight:900;}
.harrow{color:var(--accent);font-size:20px;margin:0 6px;}

/* TABS */
.tabs{width:100%;max-width:500px;padding:0 16px 14px;display:flex;gap:8px;}
.tab{flex:1;padding:10px 4px;text-align:center;border-radius:13px;
  border:2px solid var(--border);background:var(--card);color:var(--muted);
  font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;}
.tab.ja{background:var(--ja);color:#fff;border-color:var(--ja);}
.tab.fil{background:var(--fil);color:#fff;border-color:var(--fil);}
.swapt{width:42px;flex-shrink:0;border-radius:13px;
  border:2px solid var(--border);background:var(--card);font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .4s cubic-bezier(.68,-.55,.27,1.55);}
.swapt:active{transform:rotate(180deg);}

/* INPUT CARD */
.icard{width:calc(100% - 32px);max-width:468px;
  background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
  margin-bottom:12px;overflow:hidden;}
.icard-top{display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px 6px;}
.icard-lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.4;}
.char-cnt{font-size:11px;color:var(--muted);}

/* iOS音声入力案内 */
.ios-guide{
  display:none;
  background:#e8f4fd;border-bottom:1px solid #b3d9f7;
  padding:10px 16px;font-size:12px;color:#1565c0;line-height:1.7;
}
.ios-guide b{font-size:13px;}

/* テキスト入力 */
.vin-wrap{padding:4px 16px 10px;position:relative;}
textarea.vin{
  width:100%;min-height:90px;max-height:150px;
  border:2px solid var(--border);border-radius:12px;
  outline:none;resize:none;padding:10px 36px 10px 12px;
  font-size:20px;line-height:1.65;font-family:inherit;
  color:var(--text);background:#fafafa;transition:border-color .2s;
}
textarea.vin:focus{border-color:var(--ja);}
textarea.vin.fil:focus{border-color:var(--fil);}
.vin-clear{position:absolute;right:24px;top:12px;background:none;border:none;
  font-size:18px;color:var(--muted);cursor:pointer;padding:4px;}

/* フロー＆ボタン行 */
.action-row{
  display:flex;align-items:center;gap:10px;
  padding:6px 16px 14px;border-top:1px solid var(--border);
}
/* マイクボタン（Chrome/Android用） */
.mic-btn{
  width:48px;height:48px;border-radius:50%;border:none;
  background:var(--ja);color:#fff;flex-shrink:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 12px rgba(26,26,46,.28);transition:all .2s;
}
.mic-btn svg{width:22px;height:22px;fill:currentColor;}
.mic-btn.listening{background:var(--accent);animation:pulse 1.1s infinite;}
.mic-btn.fil-mode{background:var(--fil);}
.mic-btn.ios-hide{display:none;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(231,76,60,.5)}70%{box-shadow:0 0 0 16px rgba(231,76,60,0)}100%{box-shadow:0 0 0 0 rgba(231,76,60,0)}}
.wv{display:none;align-items:flex-end;gap:3px;height:22px;}
.mic-btn.listening .wv{display:flex;}
.mic-btn.listening svg{display:none;}
.wb{width:3px;border-radius:3px;background:#fff;animation:wba 1s infinite ease-in-out;}
.wb:nth-child(1){animation-delay:0s}.wb:nth-child(2){animation-delay:.15s}
.wb:nth-child(3){animation-delay:.3s}.wb:nth-child(4){animation-delay:.45s}
.wb:nth-child(5){animation-delay:.6s}
@keyframes wba{0%,100%{height:3px;opacity:.4}50%{height:18px;opacity:1}}

/* ステップ */
.steps{display:flex;align-items:center;gap:4px;flex:1;justify-content:center;}
.st{font-size:10px;font-weight:700;padding:4px 8px;border-radius:20px;
  background:#eee;color:var(--muted);transition:all .3s;white-space:nowrap;}
.st.on{background:var(--accent);color:#fff;}
.st.done{background:var(--green);color:#fff;}
.st.on.t{background:var(--orange);}
.st.on.s{background:var(--green);}
.st-a{font-size:11px;color:#ccc;}

/* 翻訳ボタン */
.tr-btn{
  padding:12px 18px;border-radius:13px;border:none;flex-shrink:0;
  color:#fff;font-size:14px;font-weight:700;font-family:inherit;
  cursor:pointer;box-shadow:0 3px 12px rgba(26,26,46,.22);
  transition:all .2s;display:flex;align-items:center;gap:6px;
}
.tr-btn[data-dir="ja"]{background:var(--ja);}
.tr-btn[data-dir="fil"]{background:var(--fil);}
.tr-btn.loading{opacity:.55;cursor:wait;}
.tr-btn:active{transform:scale(.97);}

/* STATUS */
.sb{width:100%;max-width:500px;text-align:center;
  padding:4px 16px 6px;font-size:12px;color:var(--muted);min-height:22px;}
.sb.err{color:var(--accent);}
.sb.ok{color:var(--green);}

/* OUTPUT CARD */
.ocard{width:calc(100% - 32px);max-width:468px;
  background:#fdf9f6;border:2px solid var(--border);
  border-radius:var(--r);margin-bottom:10px;overflow:hidden;}
.ocard-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 4px;}
.ocard-lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);opacity:.75;}
.ocard-body{font-size:22px;line-height:1.65;padding:4px 14px 16px;
  color:var(--text);min-height:60px;word-break:break-word;}
.ocard-body.ph{color:#ccc;font-size:14px;}
.ocard-acts{display:none;gap:8px;padding:8px 14px 12px;border-top:1px solid var(--border);}
.ocard-acts.show{display:flex;}
.abt{padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);background:#fff;
  font-size:12px;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;gap:4px;color:var(--text);transition:all .15s;}
.abt.sp{background:var(--accent);color:#fff;border-color:var(--accent);}

/* BUBBLE */
.bwrap{display:none;width:calc(100% - 32px);max-width:468px;margin-bottom:24px;}
.bwrap.show{display:block;}
.btip{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;}
.bubble{color:#fff;border-radius:20px 20px 20px 5px;
  padding:20px 24px;font-size:30px;font-weight:900;line-height:1.45;
  word-break:break-word;
  animation:pop .3s cubic-bezier(.68,-.55,.27,1.55);}
.bubble.fil-bubble{background:var(--accent);box-shadow:0 8px 32px rgba(231,76,60,.28);}
.bubble.ja-bubble{background:var(--ja);border-radius:20px 20px 5px 20px;
  box-shadow:0 8px 32px rgba(26,26,46,.22);}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
.bcap{margin-top:10px;font-size:12px;color:var(--muted);text-align:center;}

/* セキュリティバッジ */
.sec-badge{
  width:calc(100% - 32px);max-width:468px;
  background:#f0fff4;border:1px solid #86efac;
  border-radius:12px;padding:10px 14px;
  font-size:11px;color:#166534;line-height:1.6;
  display:flex;gap:8px;align-items:flex-start;
  margin-bottom:8px;
}
</style>
</head>
<body>

<header>
  <span class="flag">🇯🇵</span>
  <span class="htitle">日本語</span>
  <span class="harrow">⇄</span>
  <span class="htitle">Filipino</span>
  <span class="flag">🇵🇭</span>
</header>

<div class="tabs">
  <button class="tab ja" id="tab-ja" onclick="setDir('ja')">🇯🇵 日本語 → Filipino</button>
  <button class="swapt" onclick="swapDir()">⇄</button>
  <button class="tab" id="tab-fil" onclick="setDir('fil')">Filipino → 🇯🇵 日本語</button>
</div>

<!-- セキュリティバッジ -->
<div class="sec-badge">
  🔒 <span>APIキー不要・個人情報の送信なし・翻訳テキストのみGoogle翻訳に送信されます</span>
</div>

<div class="icard">
  <div class="icard-top">
    <span class="icard-lbl" id="in-lbl">日本語で入力</span>
    <span class="char-cnt"><span id="vcnt">0</span>/500</span>
  </div>

  <!-- iOS音声入力ガイド -->
  <div class="ios-guide" id="ios-guide">
    <b>📱 音声入力：</b>下のボックスをタップ → キーボード右下の <b>🎤</b> を押して話す → 翻訳ボタン
  </div>

  <div class="vin-wrap">
    <textarea class="vin" id="vin" rows="3"
      placeholder="ここをタップして入力してください"
      inputmode="text" autocomplete="off" autocorrect="off" spellcheck="false"
      oninput="onVinInput()" onkeydown="onVinKey(event)"></textarea>
    <button class="vin-clear" onclick="clearVin()">✕</button>
  </div>

  <div class="action-row">
    <!-- マイクボタン（iOS以外） -->
    <button class="mic-btn" id="mic-btn" onclick="onMicTap()">
      <svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm6.07 9.21a.75.75 0 0 1 .82.67A7 7 0 0 1 12.75 17.93V20h1.75a.75.75 0 0 1 0 1.5h-5a.75.75 0 0 1 0-1.5h1.75v-2.07A7 7 0 0 1 5.11 10.88a.75.75 0 1 1 1.49.15A5.5 5.5 0 0 0 17.5 11a.75.75 0 0 1 .57-.79z"/></svg>
      <div class="wv"><div class="wb"></div><div class="wb"></div><div class="wb"></div><div class="wb"></div><div class="wb"></div></div>
    </button>

    <div class="steps">
      <div class="st" id="s1">🎤</div>
      <span class="st-a">→</span>
      <div class="st" id="s2">🔄</div>
      <span class="st-a">→</span>
      <div class="st" id="s3">🔊</div>
    </div>

    <button class="tr-btn" id="tr-btn" data-dir="ja" onclick="doTranslate()">
      <span id="tr-icon">🔄</span><span id="tr-txt">翻訳</span>
    </button>
  </div>
</div>

<div class="sb" id="sb"></div>

<div class="ocard">
  <div class="ocard-hd">
    <span class="ocard-lbl" id="out-lbl">翻訳結果（Filipino）</span>
    <button class="abt" style="font-size:11px;padding:4px 10px" onclick="clearAll()">✕</button>
  </div>
  <div class="ocard-body ph" id="out-text">翻訳がここに表示されます</div>
  <div class="ocard-acts" id="out-acts">
    <button class="abt sp" onclick="speakAgain()">🔊 読み上げ</button>
    <button class="abt" onclick="copyOut()">📋 コピー</button>
  </div>
</div>

<div class="bwrap" id="bwrap">
  <div class="btip">📢 相手に見せる</div>
  <div class="bubble" id="bubble"></div>
  <div class="bcap" id="bcap"></div>
</div>

<script>
// ════════════════════════
// STATE
// ════════════════════════
let dir='ja', translated='', phase='idle';
let recog=null, listening=false, blurTimer=null;
let isIOS=false, hasSR=false;

// ════════════════════════
// TRANSLATE APIs（優先順位順）
// ════════════════════════
const APIS = [
  // 1. Google Translate (gtx client - ブラウザからCORS許可)
  async (text, from, to) => {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('gtx:'+res.status);
    const data = await res.json();
    return data[0].map(x=>x[0]).filter(Boolean).join('');
  },
  // 2. MyMemory (フォールバック)
  async (text, from, to) => {
    const langMap = {ja:'ja', tl:'tl'};
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
    const res = await fetch(url, {headers:{'User-Agent':'Mozilla/5.0'}});
    if (!res.ok) throw new Error('mymemory:'+res.status);
    const data = await res.json();
    if (data.responseStatus !== 200) throw new Error('mymemory:'+data.responseStatus);
    return data.responseData.translatedText;
  },
  // 3. Lingva Translate (オープンソースGoogle翻訳代替)
  async (text, from, to) => {
    const url = `https://lingva.ml/api/v1/${from}/${to}/${encodeURIComponent(text)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('lingva:'+res.status);
    const data = await res.json();
    return data.translation;
  }
];

// 言語コードマッピング
function getLangCode(dir, side) {
  // side: 'from' or 'to'
  if (dir === 'ja') return side === 'from' ? 'ja' : 'tl';
  return side === 'from' ? 'tl' : 'ja';
}

// ════════════════════════
// INIT
// ════════════════════════
window.addEventListener('load', () => {
  isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  hasSR = !!(window.SpeechRecognition || window.webkitSpeechRecognition);

  if (isIOS || !hasSR) {
    document.getElementById('mic-btn').classList.add('ios-hide');
    document.getElementById('ios-guide').style.display = 'block';
  }

  // blurで自動翻訳（iOS音声入力完了検知）
  document.getElementById('vin').addEventListener('blur', () => {
    if (blurTimer) clearTimeout(blurTimer);
    const v = document.getElementById('vin').value.trim();
    if (isIOS && v && phase === 'idle') {
      blurTimer = setTimeout(() => doTranslate(), 600);
    }
  });
});

// ════════════════════════
// DIRECTION
// ════════════════════════
function setDir(d) {
  dir = d;
  document.getElementById('tab-ja').className  = 'tab'+(d==='ja'?' ja':'');
  document.getElementById('tab-fil').className = 'tab'+(d==='fil'?' fil':'');
  document.getElementById('in-lbl').textContent  = d==='ja'?'日本語で入力':'Filipino na i-type';
  document.getElementById('out-lbl').textContent = d==='ja'?'翻訳結果（Filipino）':'翻訳結果（日本語）';
  document.getElementById('tr-btn').dataset.dir  = d;
  document.getElementById('tr-txt').textContent  = d==='ja'?'翻訳':'Isalin';
  document.getElementById('vin').className = 'vin'+(d==='fil'?' fil':'');
  document.getElementById('vin').placeholder = d==='ja'?'ここをタップして入力してください':'I-tap dito para mag-type';
  const mic = document.getElementById('mic-btn');
  mic.classList.remove('ja-mode','fil-mode');
  mic.classList.add(d==='ja'?'ja-mode':'fil-mode');
  clearAll();
}
function swapDir() {
  const b=document.querySelector('.swapt');
  b.style.transform='rotate(180deg)';
  setTimeout(()=>b.style.transform='',380);
  setDir(dir==='ja'?'fil':'ja');
}

// ════════════════════════
// INPUT
// ════════════════════════
function onVinInput() {
  const v = document.getElementById('vin').value;
  document.getElementById('vcnt').textContent = Math.min(v.length,500);
}
function onVinKey(e) {
  if (e.key==='Enter'&&!e.shiftKey) { e.preventDefault(); doTranslate(); }
}
function clearVin() {
  document.getElementById('vin').value='';
  document.getElementById('vcnt').textContent='0';
  if (blurTimer) clearTimeout(blurTimer);
}

// ════════════════════════
// TRANSLATE
// ════════════════════════
async function doTranslate() {
  const text = document.getElementById('vin').value.trim();
  if (!text) { setStatus('テキストを入力してください','err'); return; }
  if (phase !== 'idle') return;

  setStep('translate');
  const from = getLangCode(dir,'from');
  const to   = getLangCode(dir,'to');

  let result = null;
  let lastErr = '';

  // APIを順番に試す
  for (let i=0; i<APIS.length; i++) {
    try {
      result = await APIS[i](text, from, to);
      if (result && result.trim()) break;
    } catch(e) {
      lastErr = e.message;
      continue;
    }
  }

  if (!result || !result.trim()) {
    setStep('idle');
    setStatus('翻訳に失敗しました。ネットワークを確認してください。','err');
    return;
  }

  showResult(result.trim());
  autoSpeak(result.trim());
}

// ════════════════════════
// SPEAK
// ════════════════════════
function autoSpeak(text) {
  setStep('speak');
  const lang = dir==='ja'?'tl-PH':'ja-JP';
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang=lang; u.rate=0.88;
  setTimeout(()=>speechSynthesis.speak(u), isIOS?250:0);
  u.onend  = ()=>{ setStep('idle'); setStatus('✅ 完了！','ok'); setTimeout(()=>setStatus(''),3000); };
  u.onerror= ()=>{ setStep('idle'); };
}
function speakAgain() { if(translated) autoSpeak(translated); }

// ════════════════════════
// SHOW RESULT
// ════════════════════════
function showResult(t) {
  translated = t;
  const el = document.getElementById('out-text');
  el.textContent=t; el.className='ocard-body';
  document.getElementById('out-acts').className='ocard-acts show';
  document.getElementById('bubble').textContent=t;
  document.getElementById('bubble').className='bubble '+(dir==='ja'?'fil-bubble':'ja-bubble');
  document.getElementById('bcap').textContent=
    dir==='ja'?'↑ フィリピン語を相手に見せてください':'↑ 日本語を相手に見せてください';
  document.getElementById('bwrap').className='bwrap show';
}

// ════════════════════════
// MIC（Chrome/Android）
// ════════════════════════
async function onMicTap() {
  if (listening) { stopMic(); return; }
  if (phase!=='idle') return;

  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if (!SR) return;

  try {
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    s.getTracks().forEach(t=>t.stop());
  } catch(err) {
    const m={NotAllowedError:'マイクが拒否されました',NotFoundError:'マイクが見つかりません'};
    setStatus('⚠️ '+(m[err.name]||err.name),'err'); return;
  }

  if (recog) { try{recog.abort();}catch(e){} recog=null; }
  recog = new SR();
  recog.lang = dir==='ja'?'ja-JP':'tl-PH';
  recog.interimResults=true; recog.continuous=false; recog.maxAlternatives=1;

  let finalText='', gotFinal=false;

  recog.onstart = ()=>{
    listening=true;
    document.getElementById('mic-btn').classList.add('listening');
    setStep('listen'); setStatus('');
  };
  recog.onresult = (e)=>{
    let interim=''; finalText=''; gotFinal=false;
    for(const r of e.results){
      if(r.isFinal){finalText+=r[0].transcript;gotFinal=true;}
      else interim+=r[0].transcript;
    }
    const shown=finalText||interim;
    document.getElementById('vin').value=shown;
    document.getElementById('vcnt').textContent=shown.length;
  };
  recog.onend = ()=>{
    listening=false; recog=null;
    document.getElementById('mic-btn').classList.remove('listening');
    if(gotFinal&&finalText.trim()) doTranslate();
    else { setStep('idle'); if(!gotFinal) setStatus('音声を認識できませんでした','err'); }
  };
  recog.onerror = (e)=>{
    listening=false; recog=null;
    document.getElementById('mic-btn').classList.remove('listening');
    setStep('idle');
    const m={'not-allowed':'マイクが拒否されました','no-speech':'音声が検出されませんでした',
      'network':'ネットワークエラー','aborted':''};
    const msg=m[e.error]??('エラー: '+e.error);
    if(msg) setStatus('⚠️ '+msg,'err');
  };
  try { recog.start(); }
  catch(e){ setStatus('音声認識を開始できませんでした','err'); recog=null; setStep('idle'); }
}
function stopMic(){ if(recog){try{recog.stop();}catch(e){}} }

// ════════════════════════
// STEP & UTILS
// ════════════════════════
function setStep(s) {
  phase=s;
  const s1=document.getElementById('s1');
  const s2=document.getElementById('s2');
  const s3=document.getElementById('s3');
  s1.className='st'; s2.className='st'; s3.className='st';
  const btn=document.getElementById('tr-btn');
  const ico=document.getElementById('tr-icon');
  const txt=document.getElementById('tr-txt');
  if(s==='listen'){s1.classList.add('on');btn.classList.add('loading');}
  else if(s==='translate'){s1.classList.add('done');s2.classList.add('on','t');
    btn.classList.add('loading');ico.textContent='⏳';txt.textContent='翻訳中…';}
  else if(s==='speak'){s1.classList.add('done');s2.classList.add('done');s3.classList.add('on','s');
    btn.classList.remove('loading');ico.textContent='🔊';txt.textContent='読み上げ中…';}
  else{btn.classList.remove('loading');ico.textContent='🔄';
    txt.textContent=dir==='ja'?'翻訳':'Isalin';}
}
function copyOut(){
  if(!translated)return;
  navigator.clipboard.writeText(translated)
    .then(()=>{setStatus('📋 コピーしました！','ok');setTimeout(()=>setStatus(''),2000);})
    .catch(()=>setStatus('コピーできませんでした','err'));
}
function clearAll(){
  clearVin();
  document.getElementById('out-text').textContent='翻訳がここに表示されます';
  document.getElementById('out-text').className='ocard-body ph';
  document.getElementById('out-acts').className='ocard-acts';
  document.getElementById('bwrap').className='bwrap';
  translated=''; setStatus(''); setStep('idle');
  speechSynthesis.cancel();
}
function setStatus(msg,type=''){
  const el=document.getElementById('sb');
  el.textContent=msg;
  el.className='sb'+(type?' '+type:'');
}
</script>
